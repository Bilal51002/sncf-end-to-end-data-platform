# ============================================================
# SNCF End-TO-END DATA PLATFORM
# Docker Compose
# ============================================================

x-airflow-common-env: &airflow-common-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/airflow
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"

  # Airflow 3 Execution API
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
  AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: "3600"

  # Local project code
  PYTHONPATH: /opt/airflow

  # Pipeline databases: internal Docker service names and ports
  SOURCE_DB_HOST: source_db
  SOURCE_DB_PORT: "5432"
  SOURCE_DB_NAME: ${SOURCE_DB_NAME}
  SOURCE_DB_USER: ${SOURCE_DB_USER}
  SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD}

  DW_DB_HOST: dw_db
  DW_DB_PORT: "5432"
  DW_DB_NAME: ${DW_DB_NAME}
  DW_DB_USER: ${DW_DB_USER}
  DW_DB_PASSWORD: ${DW_DB_PASSWORD}

  ETL_CHUNK_SIZE: ${ETL_CHUNK_SIZE:-100000}

x-airflow-common-volumes: &airflow-common-volumes
  - ./dags:/opt/airflow/dags
  - airflow_logs:/opt/airflow/logs
  - ./plugins:/opt/airflow/plugins
  - ./src:/opt/airflow/src

x-airflow-build: &airflow-build
  context: .
  dockerfile: Dockerfile.airflow


services:

  # ============================================================
  # SOURCE DATABASE
  # ============================================================
  source_db:
    image: postgres:16
    container_name: sncf_source
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SOURCE_DB_NAME}
      POSTGRES_USER: ${SOURCE_DB_USER}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD}

    ports:
      - "${SOURCE_DB_PORT:-5433}:5432"

    volumes:
      - source_db_data:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./sql/source:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SOURCE_DB_USER} -d ${SOURCE_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ============================================================
  # DATA WAREHOUSE DATABASE
  # ============================================================
  dw_db:
    image: postgres:16
    container_name: sncf_dw
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DW_DB_NAME}
      POSTGRES_USER: ${DW_DB_USER}
      POSTGRES_PASSWORD: ${DW_DB_PASSWORD}

    ports:
      - "${DW_DB_PORT:-5434}:5432"

    volumes:
      - dw_db_data:/var/lib/postgresql/data
      - ./sql/dw:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DW_DB_USER} -d ${DW_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ============================================================
  # AIRFLOW METADATA DATABASE
  # ============================================================
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ============================================================
  # AIRFLOW INIT
  # One-off container: migrate metadata DB + create admin user
  # ============================================================
  airflow-init:
    build: *airflow-build
    container_name: airflow-init

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      <<: *airflow-common-env

    volumes: *airflow-common-volumes

    command:
      - bash
      - -c
      - |
        set -e

        airflow db migrate

        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME:-Bilal}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME:-Khallabi}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true


  # ============================================================
  # AIRFLOW API SERVER / WEB UI
  # ============================================================
  airflow-api-server:
    build: *airflow-build
    container_name: airflow-api-server
    restart: unless-stopped

    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      <<: *airflow-common-env
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: "1800"

    volumes: *airflow-common-volumes

    ports:
      - "8080:8080"

    command:
      - bash
      - -c
      - |
        exec airflow api-server --host 0.0.0.0 --port 8080

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/version', timeout=5)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  # ============================================================
  # AIRFLOW SCHEDULER
  # ============================================================
  airflow-scheduler:
    build: *airflow-build
    container_name: airflow-scheduler
    restart: unless-stopped

    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
      source_db:
        condition: service_healthy
      dw_db:
        condition: service_healthy

    environment:
      <<: *airflow-common-env
      AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: "1800"
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: "1800"

    volumes: *airflow-common-volumes

    command:
      - bash
      - -c
      - |
        exec airflow scheduler


  # ============================================================
  # AIRFLOW DAG PROCESSOR
  # ============================================================
  airflow-dag-processor:
    build: *airflow-build
    container_name: airflow-dag-processor
    restart: unless-stopped

    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      <<: *airflow-common-env

    volumes: *airflow-common-volumes

    command:
      - bash
      - -c
      - |
        exec airflow dag-processor


  # ============================================================
  # AIRFLOW TRIGGERER
  # ============================================================
  airflow-triggerer:
    build: *airflow-build
    container_name: airflow-triggerer
    restart: unless-stopped

    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      <<: *airflow-common-env

    volumes: *airflow-common-volumes

    command:
      - bash
      - -c
      - |
        exec airflow triggerer


# ============================================================
# PERSISTENT VOLUMES
# ============================================================
volumes:
  source_db_data:
  dw_db_data:
  airflow_postgres_data:
  airflow_logs:
