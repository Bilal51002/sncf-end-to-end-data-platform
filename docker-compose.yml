services:

  # ============================================================
  # SOURCE DATABASE
  # ============================================================
  source_db:
    image: postgres:16
    container_name: sncf_source
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SOURCE_DB_NAME}
      POSTGRES_USER: ${SOURCE_DB_USER}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD}

    ports:
      - "${SOURCE_DB_PORT}:5432"

    volumes:
      - source_db_data:/var/lib/postgresql/data
      - ./data:/data:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SOURCE_DB_USER} -d ${SOURCE_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # DATA WAREHOUSE DATABASE
  # ============================================================
  dw_db:
    image: postgres:16
    container_name: sncf_dw
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DW_DB_NAME}
      POSTGRES_USER: ${DW_DB_USER}
      POSTGRES_PASSWORD: ${DW_DB_PASSWORD}

    ports:
      - "${DW_DB_PORT}:5432"

    volumes:
      - dw_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DW_DB_USER} -d ${DW_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # AIRFLOW METADATA DATABASE
  # (simple conteneur Postgres : n'a besoin d'aucune variable Airflow)
  # ============================================================
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # AIRFLOW INIT
  # ============================================================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-init

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

      # Airflow 3 authentication manager
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      # Airflow 3 (AIP-72) : les taches communiquent avec le scheduler via
      # une API HTTP, pas par acces direct a la base. Sans ces variables,
      # identiques sur tous les services, chaque tache echoue avec
      # "Connection refused" ou "Invalid auth token".
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      # Duree de vie du jeton (secondes) : le defaut est trop court pour
      # des taches qui transforment plusieurs millions de lignes.
      AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: "3600"

      # Allow Airflow to load local source code
      PYTHONPATH: /opt/airflow

      # Bases de donnees du pipeline (noms de service Docker, pas localhost)
      SOURCE_DB_HOST: source_db
      SOURCE_DB_PORT: "5432"
      DW_DB_HOST: dw_db
      DW_DB_PORT: "5432"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/src

    command:
      - bash
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username admin \
          --password admin \
          --firstname Bilal \
          --lastname Khallabi \
          --role Admin \
          --email admin@example.com || true


  # ============================================================
  # AIRFLOW API SERVER
  # ============================================================
  airflow-api-server:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-api-server
    restart: unless-stopped

    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: "3600"

      PYTHONPATH: /opt/airflow

      SOURCE_DB_HOST: source_db
      SOURCE_DB_PORT: "5432"
      DW_DB_HOST: dw_db
      DW_DB_PORT: "5432"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/src

    ports:
      - "8080:8080"

    command:
      - bash
      - -c
      - |
        airflow api-server --host 0.0.0.0 --port 8080


  # ============================================================
  # AIRFLOW SCHEDULER
  # ============================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-scheduler
    restart: unless-stopped

    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: "3600"
      AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: "1800"

      PYTHONPATH: /opt/airflow

      SOURCE_DB_HOST: source_db
      SOURCE_DB_PORT: "5432"
      DW_DB_HOST: dw_db
      DW_DB_PORT: "5432"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/src

    command:
      - bash
      - -c
      - |
        airflow scheduler


  # ============================================================
  # AIRFLOW DAG PROCESSOR
  # ============================================================
  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-dag-processor
    restart: unless-stopped

    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: "3600"

      PYTHONPATH: /opt/airflow

      SOURCE_DB_HOST: source_db
      SOURCE_DB_PORT: "5432"
      DW_DB_HOST: dw_db
      DW_DB_PORT: "5432"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/src

    command:
      - bash
      - -c
      - |
        airflow dag-processor


  # ============================================================
  # AIRFLOW TRIGGERER
  # ============================================================
  airflow-triggerer:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-triggerer
    restart: unless-stopped

    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: "3600"

      PYTHONPATH: /opt/airflow

      SOURCE_DB_HOST: source_db
      SOURCE_DB_PORT: "5432"
      DW_DB_HOST: dw_db
      DW_DB_PORT: "5432"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/src

    command:
      - bash
      - -c
      - |
        airflow triggerer


# ============================================================
# VOLUMES
# ============================================================
volumes:
  source_db_data:
  dw_db_data:
  airflow_postgres_data:
